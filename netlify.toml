[build]
# Monorepo: frontend w "front-end/"
base = "front-end"
command = "npm ci && npm run build"
# Publikujemy gotowy build z katalogu front-end/dist
publish = "dist"

[build.environment]
NODE_VERSION = "18"

# Proxy wszystkich wywołań API przez Netlify do Rendera (eliminuje CORS)
[[redirects]]
from = "/api/*"
to = "https://shop-in-react.onrender.com/:splat"
status = 200
force = true

# SPA fallback — wszystkie inne ścieżki obsłuży React Router
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
